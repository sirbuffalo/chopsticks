<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Chopsticks</title>
    <meta
      name="description"
      content="Play Chopsticks against a fast Rust-powered bot in your browser."
    />
    <meta property="og:title" content="Chopsticks" />
    <meta
      property="og:description"
      content="Play Chopsticks against a fast Rust-powered bot in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/favicons/favicon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chopsticks" />
    <meta
      name="twitter:description"
      content="Play Chopsticks against a fast Rust-powered bot in your browser."
    />
    <meta name="twitter:image" content="assets/favicons/favicon-512.png" />
    <link rel="icon" href="assets/favicons/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicons/favicon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game">
      <div class="player-hands" data-person="opponent">
        <div class="hand" data-person="opponent" data-hand="0">1</div>
        <div class="hand" data-person="opponent" data-hand="1">1</div>
      </div>
      <div class="player-hands" data-person="user">
        <div class="hand" data-person="user" data-hand="0" draggable="true">
          1
        </div>
        <div class="hand" data-person="user" data-hand="1" draggable="true">
          1
        </div>
      </div>
      <div class="rearrange-actions">
        <button class="rearrange-cancel" type="button">Cancel</button>
        <button class="rearrange" type="button">Rearrange</button>
      </div>
      <div class="banner-wrapper" hidden>
        <div class="banner">
          <span class="banner-title"></span>
          <button class="play-again" type="button">Play again</button>
        </div>
      </div>
      <div class="toast" aria-live="polite"></div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
