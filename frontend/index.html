<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <title>Chopsticks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="game">
        <div class="player-hands" data-person="opponent">
            <div class="hand" data-person="opponent" data-hand="0">1</div>
            <div class="hand" data-person="opponent" data-hand="1">1</div>
        </div>
        <div class="player-hands" data-person="user">
            <div class="hand" data-person="user" data-hand="0" draggable="true">1</div>
            <div class="hand" data-person="user" data-hand="1" draggable="true">1</div>
        </div>
        <div class="rearrange-actions">
            <button class="rearrange-cancel" type="button">Cancel</button>
            <button class="rearrange" type="button">Rearrange</button>
        </div>
        <div class="banner-wrapper" hidden>
            <div class="banner">
                <span class="banner-title"></span>
                <button class="play-again" type="button">Play again</button>
            </div>
        </div>
        <div class="toast" aria-live="polite"></div>
    </div>

    <script src="bot_wasm.js"></script>
    <script src="bot_cache.js"></script>
    <script src="script.js"></script>
</body>

</html>
